name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - run: composer install --no-interaction
      - run: composer cs

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - run: composer install --no-interaction
      - run: composer analyse

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - run: composer install --no-interaction
      - run: composer test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.0"
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-docs-content.ts --root docs --expected-docs 18 --expected-nav 3

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mysqli
          tools: composer
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.0"
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - run: composer install --no-interaction
      - run: pnpm install --frozen-lockfile
      - run: node tests/e2e/run-all.ts

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - run: composer install --no-interaction
      - run: composer audit --locked --no-interaction

  runtime-db:
    name: Standalone MySQL (PHP 8.2)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rudel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, pdo_mysql
          tools: composer
      - run: composer install --no-dev --optimize-autoloader --no-interaction
      - run: php tests/runtime-db.php

  tooling:
    name: TypeScript tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.0"
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:scripts
